; PlatformIO Project Configuration File for FlightCore Telemetry System
; Strictly sensor acquisition & LoRa telemetry ONLY (no motor/ESC PWM control).

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -Wall
    -Wextra
    -std=gnu++17
    -DFLIGHTCORE_STRICTLY_TELEMETRY_ONLY=1
    -DFLIGHTCORE_FW_VERSION=\"1.0.0\"
test_ignore = test_flightcore_native.cpp

[env:native]
platform = native
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -DFLIGHTCORE_NATIVE=1
    -DFLIGHTCORE_STRICTLY_TELEMETRY_ONLY=1
    -DFLIGHTCORE_FW_VERSION=\"1.0.0\"
build_src_filter =
    +<telemetry_protocol.cpp>
    +<mpu6050_driver.cpp>
    +<vl53l0x_driver.cpp>
    +<hall_rpm_driver.cpp>
    +<power_temp_monitor.cpp>
    +<lora_sx1278.cpp>
test_framework = custom
